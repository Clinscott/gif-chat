<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>GIF picker</title>
  <style>
    :root {
      color-scheme: light dark;
      --ink: #1c1a17; --ink-soft: #4f4a43; --edge: #8a8276; --surface: #ffffff; --sunken: #efece5;
      --accent: #4b37c4; --accent-hover: #3d2ca6; --on-accent: #ffffff; --cell: #8578d6;
      font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --ink: #f3f0ea; --ink-soft: #c9c3b8; --edge: #7d766b; --surface: #23211e; --sunken: #151412;
        --accent: #b2a5ff; --accent-hover: #c5bbff; --on-accent: #161236; --cell: #6f66b8;
      }
    }
    :root[data-theme="dark"] {
      --ink: #f3f0ea; --ink-soft: #c9c3b8; --edge: #7d766b; --surface: #23211e; --sunken: #151412;
      --accent: #b2a5ff; --accent-hover: #c5bbff; --on-accent: #161236; --cell: #6f66b8;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; padding: 14px 16px; color: var(--ink); background: transparent; }
    main { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; align-items: center; }
    .strip { grid-row: span 2; display: flex; gap: 2px; align-self: center; }
    .strip i { width: 6px; height: 20px; border-radius: 2px; background: var(--cell); }
    .strip i:nth-child(2) { background: var(--accent); }
    h1 { margin: 0; font-size: 14.5px; font-weight: 650; }
    .lede { margin: 0; color: var(--ink-soft); font-size: 13px; }
    .actions { grid-column: 1 / -1; display: flex; align-items: center; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; }
    button {
      font-family: inherit; font-size: 14px; font-weight: 600; line-height: 1; min-height: 36px; padding: 0 16px;
      border: 0; border-radius: 10px; background: var(--accent); color: var(--on-accent); cursor: pointer;
    }
    button:hover:not(:disabled) { background: var(--accent-hover); }
    button:disabled { background: var(--sunken); color: var(--ink-soft); cursor: default; }
    a { color: var(--ink-soft); font-size: 13px; text-underline-offset: 3px; }
    a:hover { color: var(--ink); }
    button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #status { grid-column: 1 / -1; margin: 8px 0 0; color: var(--ink-soft); font-size: 12.5px; }
  </style>
</head>
<body>
  <main aria-labelledby="title">
    <span class="strip" aria-hidden="true"><i></i><i></i><i></i></span>
    <h1 id="title">GIF picker</h1>
    <p class="lede">Search or use a file, then paste its request here.</p>
    <div class="actions">
      <button id="gif-button" type="button" disabled aria-label="Open the GIF picker">Open picker</button>
      <a id="browser-link" target="_blank" rel="noopener noreferrer" hidden>Open in your browser</a>
    </div>
    <p id="status" role="status" aria-live="polite">Getting the picker link…</p>
  </main>
  <script>
    (() => {
      "use strict";
      const button = document.getElementById("gif-button");
      const link = document.getElementById("browser-link");
      const status = document.getElementById("status");
      const pending = new Map();
      let nextId = 0;
      let pickerUrl = null;
      let openLinks = false;
      let stopped = false;
      let bridgeInitialized = false;
      let resizeObserver = null;
      let resizeTimer = null;
      let lastSize = null;

      const send = (message) => window.parent.postMessage({jsonrpc: "2.0", ...message}, "*");
      const reportSize = () => {
        if (stopped || !bridgeInitialized) return;
        const bounds = document.body.getBoundingClientRect();
        const width = Math.ceil(bounds.width), height = Math.ceil(bounds.height);
        if (!Number.isFinite(width) || !Number.isFinite(height) || width <= 0 || height <= 0) return;
        const size = width + ":" + height;
        if (size === lastSize) return;
        lastSize = size;
        send({method: "ui/notifications/size-changed", params: {width, height}});
      };
      const scheduleSize = () => {
        if (stopped || !bridgeInitialized || resizeTimer !== null) return;
        resizeTimer = setTimeout(() => {
          resizeTimer = null;
          reportSize();
        }, 50);
      };
      const request = (method, params) => new Promise((resolve, reject) => {
        const id = ++nextId;
        const timer = setTimeout(() => {
          pending.delete(id);
          reject({code: "timeout"});
        }, 5000);
        pending.set(id, {resolve, reject, timer});
        send({id, method, params});
      });

      const applyTheme = (theme) => {
        if (theme === "light" || theme === "dark") document.documentElement?.setAttribute("data-theme", theme);
      };

      const clearPicker = () => {
        pickerUrl = null;
        button.disabled = true;
        link.hidden = true;
        link.removeAttribute("href");
      };

      const receiveResult = (result) => {
        clearPicker();
        const value = result?.structuredContent?.url;
        try {
          const url = new URL(value);
          if (result?.isError || typeof value !== "string" || /\s/.test(value)
              || url.protocol !== "http:" || !["127.0.0.1", "localhost", "[::1]"].includes(url.hostname)
              || !/^http:\/\/(?:127\.0\.0\.1|localhost|\[::1\]):\d+(?:[/?#]|$)/i.test(value)
              || url.username || url.password) throw new Error("Invalid local link");
          pickerUrl = value;
          link.href = value;
          link.hidden = false;
          button.disabled = false;
          status.textContent = "Ready. The link works until this session ends.";
        } catch (_) {
          status.textContent = "No picker link came through. Ask for the GIF picker again.";
        }
        scheduleSize();
      };

      const receive = (event) => {
        if (stopped || event.source !== window.parent) return;
        const message = event.data;
        if (!message || message.jsonrpc !== "2.0") return;
        if (message.method === "ui/resource-teardown" && message.id !== undefined) {
          stopped = true;
          clearPicker();
          resizeObserver?.disconnect();
          if (resizeTimer !== null) clearTimeout(resizeTimer);
          window.removeEventListener("resize", scheduleSize);
          for (const entry of pending.values()) {
            clearTimeout(entry.timer);
            entry.reject({code: "closed"});
          }
          pending.clear();
          window.removeEventListener("message", receive);
          send({id: message.id, result: {}});
          return;
        }
        if (message.method === undefined && pending.has(message.id)) {
          const entry = pending.get(message.id);
          pending.delete(message.id);
          clearTimeout(entry.timer);
          if (message.error) entry.reject(message.error);
          else if ("result" in message) entry.resolve(message.result);
          else entry.reject({code: "invalid_response"});
          return;
        }
        if (message.method === "ui/notifications/host-context-changed") applyTheme(message.params?.theme);
        if (message.method === "ui/notifications/tool-result") receiveResult(message.params);
        if (message.method === "ui/notifications/tool-cancelled") {
          clearPicker();
          status.textContent = "Cancelled. Ask again whenever you like.";
          scheduleSize();
        }
      };
      window.addEventListener("message", receive);

      button.addEventListener("click", async () => {
        if (!pickerUrl || stopped) return;
        if (!openLinks) {
          link.click();
          return;
        }
        button.disabled = true;
        try {
          await request("ui/open-link", {url: pickerUrl});
          if (!stopped) status.textContent = "Picker opened. Pick a GIF, then paste its request here.";
        } catch (error) {
          if (error.code === -32601 || error.code === "timeout") openLinks = false;
          if (!stopped) status.textContent = "Couldn’t open it from here. Use the browser link.";
        } finally {
          button.disabled = stopped || !pickerUrl;
          scheduleSize();
        }
      });

      request("ui/initialize", {
        appInfo: {name: "gif-chat-picker", version: "1.0.0"},
        appCapabilities: {availableDisplayModes: ["inline"]}, protocolVersion: "2026-01-26"
      }).then((result) => {
        if (stopped) return;
        if (result?.protocolVersion !== "2026-01-26" || !result.hostCapabilities
            || typeof result.hostCapabilities !== "object" || Array.isArray(result.hostCapabilities)) {
          throw new Error("Unsupported MCP Apps bridge");
        }
        bridgeInitialized = true;
        applyTheme(result.hostContext?.theme);
        openLinks = !!result.hostCapabilities.openLinks;
        send({method: "ui/notifications/initialized", params: {}});
        if (typeof ResizeObserver === "function") {
          resizeObserver = new ResizeObserver(scheduleSize);
          resizeObserver.observe(document.body);
        }
        window.addEventListener("resize", scheduleSize);
        reportSize();
      }).catch(() => {
        if (!stopped && !pickerUrl) status.textContent = "If the button doesn’t work here, use the picker link in the chat.";
      });
    })();
  </script>
</body>
</html>
