name: Source and package checks
on:
  push:
    paths-ignore: ['docs/**', 'README.md', 'AGENTS.md']
  pull_request:
    paths-ignore: ['docs/**', 'README.md', 'AGENTS.md']
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.23'
          python-version: '3.12.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: uv venv --python 3.12.14 .venv
      - run: uv pip install -r requirements.txt -r requirements-dev.txt
      - run: .venv/bin/python tools/configure_runtime.py
      - run: .venv/bin/python tools/check.py
      - run: .venv/bin/python tools/build_plugins.py
      - run: .venv/bin/python tools/smoke_plugins.py --plugins build/plugins
        env:
          GIF_RUNTIME_LOCK: ${{ github.workspace }}/.local/runtime-lock.json
      - name: Claude offline mod tests require the host CLI
        run: echo 'Run integrations/claude-code/tests/run_offline.py locally with Claude Code 2.1.287 or later; it makes no model calls.'
